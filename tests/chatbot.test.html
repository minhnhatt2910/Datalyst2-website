<!doctype html>
<meta charset="utf-8">
<title>Datalyst chatbot checks</title>
<h1>Datalyst chatbot checks</h1>
<pre id="results">Waiting for application…</pre>
<iframe id="app" src="../index.html" title="Datalyst test instance" hidden></iframe>
<script>
const output = document.querySelector('#results');
const frame = document.querySelector('#app');
const checks = [];
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
function assert(name, condition, detail = '') {
  checks.push({ name, pass: Boolean(condition), detail });
}
async function waitFor(predicate, timeout = 10000) {
  const start = Date.now();
  while (!predicate()) {
    if (Date.now() - start > timeout) throw new Error('Timed out waiting for app data');
    await wait(50);
  }
}
function report() {
  const result = JSON.parse(output.textContent);
  const payload = encodeURIComponent(JSON.stringify({ tested: result.tested || checks.length, passed: result.passed, failed: result.failed, failures: checks.filter((check) => !check.pass) }));
  fetch(`/?chatbot-test-result=${payload}`, { mode: 'no-cors', cache: 'no-store' }).catch(() => {});
}
async function run() {
  const app = frame.contentWindow;
  await waitFor(() => { try { return app.eval('STATE.rows.length') > 0; } catch (_) { return false; } });
  const expected = app.eval("metricDisplay('net_margin_pct', getNumber(rowFor('C001', 2025), 'net_margin_pct'))");
  const lookup = app.answerChat('Biên lợi nhuận ròng của C001 năm 2025 là bao nhiêu?');
  assert('lookup uses actual company, metric, and year', lookup.includes(expected) && lookup.includes('net_margin_pct') && lookup.includes('2025'));
  assert('absolute revenue limitation is explicit', app.answerChat('Doanh thu tuyệt đối của C001 năm 2025 là bao nhiêu?').includes('không có số tiền doanh thu tuyệt đối'));
  assert('unknown metric stays within supported scope', app.answerChat('Giá cổ phiếu C001 năm 2025 là bao nhiêu?').includes('có thể truy vấn'));
  assert('absolute profit is not confused with profit margin', app.answerChat('Lợi nhuận ròng của C001 năm 2025 là bao nhiêu?').includes('không có số tiền lợi nhuận tuyệt đối'));
  assert('absolute CFO is not confused with a CFO ratio', app.answerChat('CFO của C001 năm 2025 là bao nhiêu?').includes('không có số tiền CFO tuyệt đối'));
  assert('CFO margin remains queryable', /%/.test(app.answerChat('Biên CFO của C001 năm 2025 là bao nhiêu?')));
  assert('null metric is not converted to zero', app.answerChat('ROA của C001 năm 2021 là bao nhiêu?').includes('không có giá trị hợp lệ'));
  assert('missing year is reported without fallback', /không có bản ghi/i.test(app.answerChat('Biên lợi nhuận ròng của C001 năm 2030 là bao nhiêu?')));
  const trend = app.answerChat('Biên lợi nhuận ròng của C001 thay đổi qua các năm thế nào?');
  assert('trend query cites historical period', trend.includes('2021–2025'));
  assert('percentage trend separates percentage points and relative change', trend.includes('điểm phần trăm') && trend.includes('% tương đối'));
  const compare = app.answerChat('So sánh biên lợi nhuận ròng C001 và C002 năm 2025');
  assert('two-company comparison shows both values and delta', compare.includes('C001') && compare.includes('C002') && compare.includes('chênh lệch'));
  assert('percentage comparison reports percentage points', compare.includes('điểm phần trăm'));
  assert('risk response uses provided alert labels', app.answerChat('Tại sao C001 bị cảnh báo rủi ro năm 2025?').includes('2025'));
  app.document.querySelector('#forecastMetric').value = 'net_margin_pct';
  assert('forecast is labeled as extrapolation', /hồi quy tuyến tính|ngoại suy/.test(app.answerChat('Dự báo biên lợi nhuận ròng của C001 năm tới là bao nhiêu?')));
  assert('ambiguous company is clarified', app.answerChat('Biên lợi nhuận ròng năm 2025 là bao nhiêu?').includes('thiếu mã doanh nghiệp'));
  assert('out of scope query gives the supported scope', app.answerChat('Thời tiết Hà Nội ngày mai thế nào?').includes('có thể truy vấn'));

  const originalFeedback = app.localStorage.getItem('datalyst_chat_feedback_v1');
  app.localStorage.removeItem('datalyst_chat_feedback_v1');
  app.document.querySelector('#chatToggle').click();
  await waitFor(() => app.document.querySelectorAll('#chatSuggestions button').length > 0);
  app.document.querySelector('#chatSuggestions button').click();
  await waitFor(() => app.document.querySelectorAll('.chat-response').length > 0);
  assert('suggestion enters normal answer flow', app.document.querySelectorAll('.chat-response').length === 1);
  const responses = [...app.document.querySelectorAll('.chat-response')];
  responses[0].querySelector('button[data-feedback="useful"]').click();
  app.addChatResponse('Cần kiểm tra thêm cho C001 năm 2025', 'Nhận xét thử nghiệm');
  app.document.querySelectorAll('.chat-response')[1].querySelector('button[data-feedback="review"]').click();
  app.addChatResponse('Không đồng ý với nhận xét C002 năm 2024', 'Nhận xét thử nghiệm');
  app.document.querySelectorAll('.chat-response')[2].querySelector('button[data-feedback="disagree"]').click();
  const feedbackCards = [...app.document.querySelectorAll('.chat-response')];
  assert('chosen review states are visible on each response', feedbackCards.every((card, index) => card.querySelector('.chat-feedback-status').textContent.includes(['Xác nhận hữu ích', 'Cần kiểm tra thêm', 'Không đồng ý'][index])));
  feedbackCards[0].querySelector('button[data-feedback="useful"]').click();
  let saved;
  try { saved = JSON.parse(app.localStorage.getItem('datalyst_chat_feedback_v1') || '[]'); } catch (_) { saved = []; }
  assert('all feedback choices are saved with their question', saved.length === 3 && ['useful', 'review', 'disagree'].every((type) => saved.some((record) => record.feedback === type && record.question.length > 0)));
  assert('repeat click does not create duplicate feedback', saved.length === 3);
  const beforeReload = saved.length;
  frame.src = '../index.html?feedback-reload-check';
  await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
  assert('local feedback survives page reload', JSON.parse(frame.contentWindow.localStorage.getItem('datalyst_chat_feedback_v1') || '[]').length === beforeReload);

  const reloaded = frame.contentWindow;
  await waitFor(() => { try { return reloaded.eval('STATE.rows.length') > 0; } catch (_) { return false; } });
  reloaded.document.querySelector('#dashboardCompany').value = 'C001';
  reloaded.document.querySelector('#dashboardCompany').dispatchEvent(new reloaded.Event('change'));
  assert('company filter updates the existing filter state', reloaded.eval("STATE.filters.dashboard.company === 'C001'"));
  ['renderDashboard', 'renderAnalysis', 'renderComparison', 'renderForecast', 'renderAlerts', 'renderData'].forEach((name) => {
    try { reloaded[name](); assert(`${name} remains callable`, true); }
    catch (error) { assert(`${name} remains callable`, false, error.message); }
  });
  let reloadFinished = false;
  const originalFetch = reloaded.fetch.bind(reloaded);
  reloaded.fetch = (...args) => originalFetch(...args).then((response) => { reloadFinished = true; return response; });
  reloaded.document.querySelector('#reloadButton').click();
  await waitFor(() => reloadFinished && reloaded.eval('STATE.rows.length') === 60);
  reloaded.fetch = originalFetch;
  assert('CSV reload keeps the actual dataset available', reloaded.eval("STATE.sourceName === 'submission_output.csv' && STATE.rows.length === 60"));
  const trendContext = reloaded.buildChatDataContext('Xu hướng biên lợi nhuận gộp của C001 qua các năm');
  assert('LLM context uses actual data and caps a company trend at five years', trendContext.records.length === 5 && trendContext.records.every((row) => row.company_id === 'C001') && new Set(trendContext.records.map((row) => row.fiscal_year)).size === 5);
  const groupContext = reloaded.buildChatDataContext('Hãy đánh giá tổng quan tình hình tài chính');
  assert('LLM group context uses one year and at most twelve actual rows', groupContext.records.length <= 12 && new Set(groupContext.records.map((row) => row.fiscal_year)).size <= 1);
  const netMeanFact = groupContext.derived_facts.find((fact) => fact.metric === 'net_margin_pct');
  const scopedNetMargins = groupContext.records.map((row) => row.net_margin_pct).filter(Number.isFinite);
  const expectedNetMean = reloaded.eval(`mean(${JSON.stringify(scopedNetMargins)})`);
  assert('LLM receives the same deterministic group mean and count as the Dashboard', netMeanFact && netMeanFact.observation_count === scopedNetMargins.length && netMeanFact.value === expectedNetMean);
  const backtest = reloaded.rollingOriginEvaluation([{ x: 2021, value: 1 }, { x: 2022, value: 2 }, { x: 2023, value: 3 }, { x: 2024, value: 4 }, { x: 2025, value: 5 }]);
  assert('forecast backtest uses rolling origins and exposes persistence baseline metrics', backtest.periods === 2 && backtest.modelMae === 0 && Number.isFinite(backtest.persistenceMae) && backtest.modelMape !== null);
  reloaded.STATE.filters.forecast = { company: 'C001', year: 'all' };
  reloaded.document.querySelector('#forecastMetric').value = 'net_margin_pct';
  reloaded.renderForecast();
  assert('forecast view exposes rolling-origin MAE and persistence baseline', reloaded.document.querySelector('#forecastDetails').textContent.includes('Rolling-origin') && reloaded.document.querySelector('#forecastDetails').textContent.includes('baseline giữ nguyên kỳ gần nhất'));
  const sourceC001 = reloaded.eval("JSON.stringify(rowFor('C001', 2025))");
  reloaded.STATE.filters.whatIf = { company: 'C001', year: '2025' };
  reloaded.document.querySelector('#shockRevenue').value = '2.5';
  reloaded.runWhatIf();
  const whatIfLog = reloaded.STATE.whatIfLog;
  assert('what-if records source, shock, formula, and result', whatIfLog.length === 4 && whatIfLog[0].source_file === 'submission_output.csv' && whatIfLog[0].shock_percentage_points === 2.5 && whatIfLog[0].after === whatIfLog[0].before + 2.5 && whatIfLog[0].formula.includes('after = before +'));
  assert('what-if leaves source financial and risk fields unchanged', reloaded.eval("JSON.stringify(rowFor('C001', 2025))") === sourceC001);
  const originalApiFetch = reloaded.fetch;
  reloaded.fetch = () => Promise.reject(new Error('offline'));
  const fallback = await reloaded.getAssistantAnswer('Biên lợi nhuận ròng của C001 năm 2025 là bao nhiêu?');
  reloaded.fetch = originalApiFetch;
  assert('chat fallback is explicitly labeled when API is unreachable', fallback.metadata.status === 'fallback' && fallback.metadata.reason === 'offline' && fallback.answer.includes('C001'));
  reloaded.addChatResponse('test', 'fallback', fallback.metadata);
  assert('chat card visibly marks fallback and source trace', reloaded.document.querySelector('.chat-trace .chat-status-fallback')?.textContent.includes('Dự phòng cục bộ') && reloaded.document.querySelector('.chat-trace')?.textContent.includes('submission_output.csv'));
  if (originalFeedback === null) reloaded.localStorage.removeItem('datalyst_chat_feedback_v1');
  else reloaded.localStorage.setItem('datalyst_chat_feedback_v1', originalFeedback);
  const passed = checks.filter((check) => check.pass).length;
  output.textContent = JSON.stringify({ tested: checks.length, passed, failed: checks.length - passed, checks }, null, 2);
  document.documentElement.dataset.complete = 'true';
  report();
}
run().catch((error) => {
  output.textContent = JSON.stringify({ error: error.message, checks }, null, 2);
  document.documentElement.dataset.complete = 'true';
  report();
});
</script>
